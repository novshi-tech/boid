name: CI

on:
  push:
    branches:
      - main
    # docs/plans/release-onboarding.md 穴4 / PR3: a `vMAJOR.MINOR.PATCH` tag
    # push is how a real release build happens (internal/version.IsExactRelease
    # gates on this exact shape). This trigger doesn't itself validate the
    # shape — the container-image job's own BOID_VERSION step re-validates
    # with the same regex and discards anything that doesn't match — so a
    # loosely-matching tag like `v0.0.14-rc1` still can't leak through as a
    # published image tag.
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'internal/skills/data/**'
      - '.claude/skills/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'internal/skills/data/**'
      - '.claude/skills/**'

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Check internal architecture (forbidden imports)
        # ドキュメント上の規律だった禁止 import グラフ検査を CI enforcement に接続。
        run: bash scripts/check-internal-architecture.sh

      - name: Check templ generated code is up to date
        # web/templates/*_templ.go は checked-in。.templ とのズレを CI で落とす。
        # sandbox 内では templ が使えないため CI 側ゲートが必須の面。
        # generator バージョンは go.mod の a-h/templ と揃える (ズレると spurious diff)。
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1001
          templ generate
          # git diff は tracked ファイルの変更のみ。新規 .templ に対応する未コミット
          # _templ.go (untracked) も drift なので git status で両方拾う。
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::templ generated code is out of date. Run 'templ generate' and commit the result." >&2
            git status --porcelain >&2
            git diff >&2
            exit 1
          fi

      - name: Run unit tests
        # -coverprofile で総カバレッジを可視化する (品質ゲート Tier 1.5)。
        # ./... 全体を単一 profile にマージし、次 step で total 行を出力する。
        # ハード床 (coverage floor) はまだ張らない — まず可視化、傾向を見てから
        # 判断する (数字合わせテストの誘発を避けるため)。
        run: go test -coverprofile=coverage.out ./...

      - name: Report total coverage
        # go tool cover -func の末尾 total 行だけを目立たせて出す。
        # CI ログ集計で拾えるよう grep しやすい固定プレフィックスを付ける。
        run: |
          echo "[coverage] $(go tool cover -func=coverage.out | tail -1)"

      - name: Run e2e-tagged in-process tests
        # //go:build e2e が付いたテストは /usr/bin/git などホスト側バイナリを
        # 直接 exec するため通常の go test ./... からは分離している。CI では
        # 本物の git が利用可能なので、ここで明示的に走らせる。
        # e2e/upstream (docs/plans/git-gateway-cutover.md PR7a) は実
        # git-http-backend 相手の clone/push 往復試験のため同じ理由でここに属す。
        run: go test -tags=e2e ./internal/sandbox/... ./e2e/upstream/...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        # CLAUDE.md の規律 (go test -race) を CI enforcement に接続。並行処理だらけの
        # orchestrator/dispatcher が主戦場。-race は遅いので unit と別ジョブで並列実行。
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # 品質ゲート Tier 2。設定は .golangci.yml (govet / ineffassign / staticcheck /
        # unused の控えめなセット)。enforcement は CI 一択 (sandbox 内は sqlite build
        # 制約で golangci-lint を回せない)。version は再現性のため固定する。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

  container-image:
    name: Container image build
    runs-on: ubuntu-24.04
    # docs/plans/release-onboarding.md 決定4 / PR3: job-scoped, not
    # workflow-top-level (codex review of this PR, Major) — only this job's
    # publish steps need packages:write, and top-level would have handed it
    # to every job (unit/race/lint/e2e-container) including pull_request
    # runs of this same job. GITHUB_TOKEN's write access covers publishing
    # to a package this repo already owns; see the "Log in to GHCR" /
    # "Push image to GHCR" steps' own comments for what it does NOT cover
    # (initial visibility).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build shared base image (docker)
        # docs/plans/phase6-container-backend.md §PR2: keeps the Phase 6
        # shared base image (build/container/Dockerfile) + its
        # `boid runner-container` entrypoint buildable ahead of the PR5
        # containerBackend/PR7 cutover that will actually launch job
        # containers from it. ubuntu-24.04 runners have docker preinstalled
        # (the host used for day-to-day dev here only has podman — see the
        # Dockerfile's own header comment for why it's engine-agnostic
        # enough for both).
        #
        # Tag by commit SHA, not `latest`: decision 2's version-skew
        # guarantee ("boid update = image rebuild = daemon and job runner on
        # the same version") depends on the image tag identifying an exact
        # boid binary build, once PR5/PR6 start actually resolving an image
        # tag to launch containers from.
        #
        # BOID_VERSION (docs/plans/release-onboarding.md 穴2, PR1): only an
        # exact release tag counts (internal/version.IsExactRelease) — on an
        # ordinary branch push `git describe --tags --exact-match` fails and
        # this stays empty, so the built image honestly reports itself as a
        # local build (see the Dockerfile's ARG BOID_VERSION doc comment).
        # PR3 adds the tag-push trigger that makes this non-empty for a real
        # release build.
        #
        # `--exact-match` only proves some tag sits on HEAD, not that it has
        # the "vMAJOR.MINOR.PATCH" shape IsExactRelease() actually requires
        # (codex review of this PR) — a "nightly" or "v0.0.14-rc1" tag would
        # otherwise pass straight through as a build-arg. Re-validate the
        # shape here and discard anything that doesn't match.
        run: |
          set -euo pipefail
          BOID_VERSION="$(git describe --tags --exact-match 2>/dev/null || true)"
          if ! [[ "$BOID_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BOID_VERSION=""
          fi
          echo "BOID_VERSION=${BOID_VERSION:-<none>}"
          # Exported for the GHCR push step below (docs/plans/release-onboarding.md
          # 決定4 / PR3): a non-empty value there means this run is an exact
          # release-tag build, so the release tag itself becomes an additional
          # GHCR ref alongside the SHA tag every push already gets.
          echo "BOID_VERSION=${BOID_VERSION}" >> "$GITHUB_ENV"
          docker build \
            --build-arg "BOID_VERSION=${BOID_VERSION}" \
            -t "boid-runner:${GITHUB_SHA}" \
            -f build/container/Dockerfile .

      - name: Smoke-test the entrypoint
        # Confirms the default ENTRYPOINT is `boid runner-container` (not
        # some ad-hoc shim) and that it fails fast with a clear message
        # when required flags are missing (cmd/runner_container.go — the
        # sole `boid runner-*` subcommand since PR-4 removed the userns
        # launch chain). Does not exercise a real --spec run (no sandbox
        # spec / broker to point it at in CI) — that lands with the
        # containerBackend e2e in PR9.
        run: |
          set -euo pipefail
          out="$(docker run --rm "boid-runner:${GITHUB_SHA}" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q -- 'runner-container: --spec is required'

      - name: The runner protocol label is baked into the built image
        # A workspace's container_image override is only accepted if the
        # image declares boid.runner_protocol=v1
        # (internal/dispatcher/container_backend.go's resolveImage, §決定 11),
        # so an image missing it makes every override fail at launch. That was
        # the state until 2026-07-28: the Dockerfile carried no LABEL at all
        # and a live image's labels were {"io.buildah.version":"1.33.7"}.
        #
        # A Go unit test already pins that the Dockerfile and the constants
        # agree, but a LABEL can be correct and still land in the wrong build
        # stage — where it applies to the builder image and never reaches the
        # runtime one. Only inspecting a BUILT image catches that.
        run: |
          set -euo pipefail
          got="$(docker image inspect -f '{{ index .Config.Labels "boid.runner_protocol" }}' "boid-runner:${GITHUB_SHA}")"
          echo "boid.runner_protocol=${got}"
          test "$got" = "v1"

      - name: Log in to GHCR
        # docs/plans/release-onboarding.md 決定4 / PR3: only push_events run
        # this — pull_request runs get a read-only GITHUB_TOKEN for
        # forked PRs, and same-repo PRs shouldn't publish an unreviewed
        # image either. GITHUB_TOKEN + the `packages: write` permission
        # added above is enough; no extra secret is needed.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        # PR3 scope ends here: publish only. Switching the default pull
        # ref (container_backend.go / compose.yml / deploy-container.sh /
        # cmd/host.go / e2e/run-container.sh) to this GHCR ref is PR4
        # (docs/plans/release-onboarding.md 穴4 table).
        #
        # Every push (branch or tag) publishes the `${GITHUB_SHA}` ref,
        # preserving the existing "tag by commit SHA" identity this job
        # already relies on. A push that also carries an exact release
        # tag (BOID_VERSION non-empty, exported by the build step above)
        # additionally publishes that tag as its own GHCR ref — this is
        # the ref decision 4 / the PR4 default-pull-ref switch will want.
        #
        # VISIBILITY CAVEAT (codex review of this PR, Blocker — corrects an
        # earlier assumption in this comment): GITHUB_TOKEN's packages:write
        # is enough to publish, but a brand-new GHCR package defaults to
        # PRIVATE regardless of the source repo's visibility, and there is
        # no workflow-token / REST API path to flip that — changing a
        # package's visibility requires admin permission ON THE PACKAGE
        # itself, which only a human with that role can grant via the
        # GitHub UI (GITHUB_TOKEN and the write:packages PAT scope do not
        # carry it; there is no equivalent "admin:packages" token scope).
        # Decision 4's public requirement therefore is NOT fully automated
        # by this job — the first time this pushes
        # `ghcr.io/novshi-tech/boid-runner`, an org owner must flip that
        # package's visibility to Public once via Package settings:
        # https://github.com/orgs/novshi-tech/packages/container/boid-runner/settings
        # Every subsequent push keeps the visibility as-is, so this is a
        # one-time step, not a recurring one — but it must happen before
        # PR4 makes anonymous pull
        # the default path, or that pull will 403/401.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sha_ref="ghcr.io/novshi-tech/boid-runner:${GITHUB_SHA}"
          docker tag "boid-runner:${GITHUB_SHA}" "$sha_ref"
          docker push "$sha_ref"
          if [[ -n "${BOID_VERSION:-}" ]]; then
            release_ref="ghcr.io/novshi-tech/boid-runner:${BOID_VERSION}"
            docker tag "boid-runner:${GITHUB_SHA}" "$release_ref"
            docker push "$release_ref"
          fi

  e2e-container:
    name: Container backend E2E (requires-docker)
    # docs/plans/phase6-container-backend.md §PR9: real-docker verification
    # of the container backend. PR-4 (docs/plans/volume-only-daemon.md
    # §論点e) removed the userns backend entirely, along with the per-
    # scenario black-box harness (`e2e` job, e2e/run.sh + e2e/scenarios/*)
    # that exercised it — every one of those ~40 scenarios depended on
    # either the userns backend itself or `boid project add <dir>` (host-
    # directory registration, also removed in PR-4), so neither could be
    # ported forward as-is. This job is now the SOLE black-box E2E suite —
    # narrower in scenario-count than the retired one (it pins the
    # container-backend-specific invariants §決定5 calls out: sibling
    # connectivity, workspace network isolation, reap-on-shutdown — not
    # every behavior the retired scenarios covered), a known, tracked gap
    # flagged in PR-4's own PR body rather than silently absorbed.
    # "requires-docker" simply means: needs a real docker engine + compose
    # v2 plugin, which ubuntu-24.04 runners carry by default (confirmed,
    # §前提 note) — the day-to-day dev host used throughout this plan's own
    # development does NOT (podman only), so this job's coverage has no
    # local-host equivalent today.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # continue-on-error: false (docs/plans/volume-only-daemon.md §論点 h
    # migration path, PR-2b — [Major 7, PR829 round 1 codex review]'s
    # `true` regression is closed here). e2e/run-container.sh has been
    # rewritten for the volume-only project-registration model (git-URL
    # `boid project add <url> --workspace=<slug>` instead of a host
    # directory, install_id read from inside the running daemon container
    # instead of a host-visible file, config.yaml seeded into the fresh
    # boid_state named volume before first boot) — see that script's own
    # header comment for the itemized list of what changed and why. This
    # job is expected to pass again; a red run here after this PR is a real
    # regression signal, not an already-known gap.
    #
    # Historical note (kept for the §⓪/§⓪-b fix record — both gaps it
    # names were closed independently of, and before, the volume-only
    # pivot that later regressed this setting back to `true`):
    #
    #   * §⓪ (broker TCP wire completion, PR #825): the broker's TCP mTLS
    #     listener binds gatewayBindHost(usingContainerBackend) ("0.0.0.0"
    #     under sandbox.backend: container), a per-job short-lived client
    #     cert (materializeBrokerClientCert) is delivered via five
    #     BOID_BROKER_TLS_* env vars, and workspace-C's verify-broker-tls
    #     task (dispatched FIRST in e2e/run-container.sh) pins the
    #     job -> broker -> daemon RPC round trip end to end.
    #
    #   * §⓪-b (cross-workspace egress proxy relay refusal, this PR): the
    #     egress proxy (internal/sandbox/proxy.go) now refuses to relay
    #     any single-label (dotless) hostname target that is not one of
    #     the small boid-infrastructure whitelist (localhost, boid-broker,
    #     boid-gateway, boid-egress) with 502 Bad Gateway, BEFORE the
    #     allowlist check runs. Before this fix, the daemon container's
    #     simultaneous membership in every active workspace's isolated
    #     docker network (containerBackend.ensureWorkspaceNetwork, §決定5,
    #     required so a job can dial the daemon-hosted broker/gateway/
    #     egress services from its confined network at all) let its own
    #     DNS view resolve a workspace B sibling's bare hostname from a
    #     workspace A job's CONNECT — the request only failed with 403
    #     because "sib-b" wasn't in workspace A's allowed_domains, which
    #     an operator adding `allowed_domains: ["sib-b"]` could
    #     inadvertently re-open. The dotless refusal enforces the
    #     network-layer isolation contract §決定5 declares regardless of
    #     any workspace's allowed_domains configuration.
    #
    # e2e/run-container.sh's task A requirement 2 accordingly accepts both
    # "000" (direct-network failure — e.g. NO_PROXY covered the target)
    # AND "502" (the new dotless-refused path); anything else, notably
    # "403" (pre-fix behavior), is still a hard failure.
    # ---- end historical note ----
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm docker + compose v2 are available
        run: |
          set -euxo pipefail
          docker version
          docker compose version

      - name: Run container backend E2E (sibling connectivity + reap)
        # e2e/run-container.sh's own header comment documents the full
        # "sibling 疎通 3 要件" (§決定5) this exercises: job -> own-workspace
        # sibling reachable, job -> a different workspace's sibling
        # unreachable, and `docker compose down` + `boid reap` leaving zero
        # docker resources behind. KEEP_TEMP=1 on a failed run (the script's
        # own EXIT trap already handles this) so the preserved temp root
        # (containing server logs, task JSON snapshots, docker compose
        # logs) is at least visible in this step's own log even though the
        # runner discards the temp dir itself.
        run: ./e2e/run-container.sh
