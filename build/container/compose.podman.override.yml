# build/container/compose.podman.override.yml
#
# Engine-specific overlay stacked on compose.yml by
# scripts/deploy-container.sh when — and only when — it detects a ROOTLESS
# PODMAN engine (`podman info`'s Host.Security.Rootless). Docker
# deployments, and rootful podman, never load this file.
#
# WHY IT IS SEPARATE FROM compose.yml
#
# `userns_mode: keep-id` is a podman extension. `docker compose` rejects the
# value outright ("Value 'keep-id' is not valid"), so carrying it in the
# base file would break every docker deployment — including the
# e2e-container CI job, which runs against a real docker engine — in order
# to fix podman. Keeping it in a separate, conditionally-applied file lets
# each engine get exactly what it needs, with compose.yml remaining the
# single source of truth for everything that is NOT engine-specific
# (build/container/compose_podman_override_test.go pins that minimality).
#
# WHY IT IS NEEDED (2026-07-26 volume-only dogfood)
#
# Rootless podman runs a container in a user namespace where the
# container's uid 1000 maps to a host SUBUID (~100999), not to the host
# user who invoked podman. Everything compose.yml bind-mounts from the host
# is owned by that host user, so without keep-id the daemon container comes
# up unable to read any of it. Observed, in order, on the first real deploy:
#
#   WARN  cleanup orphan runtimes: read dir failed
#         error="open /run/user/1000/runtimes: permission denied"
#   ERROR startup reap failed ...
#         error="list orphan containers: permission denied while trying to
#         connect to the docker API at unix:///var/run/docker.sock"
#   start server: start broker: listen: listen unix
#         /run/user/1000/boid-broker.sock: bind: permission denied
#
# — the last of which is fatal, so the container exits 1 and host mode
# times out waiting for a health endpoint that never binds.
#
# keep-id maps the invoking host user to the same uid inside the container,
# so the daemon's in-container uid once again owns the host paths it is
# given. This is the daemon-side half of the fix; the job-container half
# (podman-detected through the docker API rather than a shell check) lives
# in internal/dispatcher/container_backend_userns.go.
#
# WHY NOT JUST DROP THE HOST BIND MOUNT INSTEAD
#
# The volume-only redesign (docs/plans/volume-only-daemon.md) already moved
# daemon STATE off host bind mounts and onto a named volume, which is what
# removed the 2026-07-24 incident's "wall 2". BOID_RUNTIME_DIR is
# deliberately still a host bind mount: internal/server/wire.go's
# hostVisibleRuntimesDirFor materializes per-job DooD sibling-container
# mount sources under it, and a DooD sibling's bind source must resolve
# against the HOST engine — a named volume's interior is invisible there.
# See compose.yml's own "Persistence" header comment for the full rationale.
# INTERACTION WITH ARBITRARY-UID (docs/plans/release-onboarding.md 決定1,
# PR2) — UNVERIFIED ON REAL PODMAN, flagged rather than silently assumed
# safe: compose.yml's `user:` moved from `${BOID_UID}:${BOID_GID}` to
# `${BOID_UID}:0` (gid pinned to 0, the OpenShift-style arbitrary-uid
# convention) in the same change that predates this comment. keep-id's own
# docs describe it as remapping the CONTAINER's uid to the invoking host
# user, which is the uid slot only — it should be orthogonal to which gid
# `user:` requests, but "should be" is not "confirmed": no docker/podman
# engine is reachable from inside the sandbox this PR's code review ran in
# (CLAUDE.md's サンドボックス実行バックエンド note), so this has only been
# checked by reading keep-id's implementation notes, not by starting a real
# rootless-podman compose stack with `user: "<uid>:0"` and inspecting it.
# Three things to confirm on a real rootless-podman host before trusting
# this combination in production (docs/plans/release-onboarding.md's own
# 決定1 実装形3 list):
#   (a) the container's EFFECTIVE uid/gid — `id` inside the running
#       container should show the host-mapped uid and gid 0, not a
#       keep-id-remapped gid;
#   (b) the `boid_state` named volume's on-disk owner after first mount —
#       should end up gid-0-writable per the image's `chgrp -R 0` +
#       `chmod -R g=u` (build/container/Dockerfile), not silently
#       re-owned by keep-id to something g=u doesn't cover;
#   (c) docker.sock (actually podman.sock under this override) reachability
#       — whether `group_add: [DOCKER_GID]` (compose.yml) still grants
#       socket access when the primary gid is forced to 0 instead of
#       whatever keep-id would otherwise have picked.
services:
  daemon:
    userns_mode: keep-id
